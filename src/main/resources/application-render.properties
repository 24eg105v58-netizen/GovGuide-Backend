spring.application.name=govguide
server.port=${PORT:10000}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

govguide.jwt.secret=${JWT_SECRET}
govguide.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

govguide.admin.default-email=${ADMIN_DEFAULT_EMAIL:admin@govguide.nic.in}
govguide.admin.default-password=${ADMIN_DEFAULT_PASSWORD}
govguide.admin.default-name=${ADMIN_DEFAULT_NAME:GovGuide Administrator}

govguide.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://govguide-frontend-9eyz.onrender.com}